name: iO

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest 

    steps:
      - name: Projeyi Cek
        uses: actions/checkout@v3

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: iOS Iskeletini Olustur
        run: flutter create . --platforms=ios

      - name: iOS Surumunu Yukselt (Fix)
        run: |
          sed -i '' 's/platform :ios, .*/platform :ios, '\''14.0'\''/g' ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Bagimliliklari Indir
        run: flutter pub get

      - name: iOS Kutuphanelerini Guncelle ve Kur
        run: |
          cd ios
          rm -f Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: iOS Icin Derle (Imzasiz)
        run: flutter build ios --release --no-codesign 

      - name: IPA Dosyasini Sideload Icin Paketle
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r vaulty.ipa Payload

      - name: IPA Dosyasini Bize Ver
        uses: actions/upload-artifact@v4
        with:
          name: vaulty-ios-ipa
          path: vaulty.ipa